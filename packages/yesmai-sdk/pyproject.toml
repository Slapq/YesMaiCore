[project]
name = "yesmai-sdk"
version = "0.1.3"
description = "面向 MaiBot 插件开发者的 YesMai 简洁 API 包装层"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Slapq" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "maibot-plugin-sdk>=2.7.0,<3.0.0",
    "Jinja2>=3.1.0,<4.0.0",
]

[project.urls]
Repository = "https://github.com/Slapq/YesMaiCore"
Issues = "https://github.com/Slapq/YesMaiCore/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["yesmai*"]
